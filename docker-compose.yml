# Deployment na NAS: web + SQLite + Go engine v jednom kontejneru.
# Data a reporty žijí na volumes, konfigurace v .env (viz .env.example).
services:
  engine:
    build: .
    image: auction-sim:latest
    container_name: auction-sim
    restart: unless-stopped
    ports:
      - "${ENGINE_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # uvnitř kontejneru vždy na pevných cestách (volumes níže)
      ENGINE_PORT: "8080"
      DB_PATH: /app/data/auction.db
      REPORTS_DIR: /app/reports
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
